name: Exportar backup completo

on:
  push:
    branches:
      - backup/export-main

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Crear ZIP
        run: git archive --format=zip --output=AI-Liquidador-backup.zip HEAD
      - name: Publicar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AI-Liquidador-backup
          path: AI-Liquidador-backup.zip
          retention-days: 90
