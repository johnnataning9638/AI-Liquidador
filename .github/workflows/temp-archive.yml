name: TEMP archive
on:
  push:
    paths:
      - ".github/workflows/temp-archive.yml"
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -qr /tmp/AI-Liquidador-depurado.zip . -x ".git/*"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Liquidador-depurado
          path: /tmp/AI-Liquidador-depurado.zip
