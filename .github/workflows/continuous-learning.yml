name: AI Continuous Learning

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain only if validated feedback is sufficient
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/continuous_train.py

      - name: Commit accepted model
        run: |
          if git diff --quiet; then
            echo "No model update accepted."
            exit 0
          fi
          git config user.name "AI Continuous Learning"
          git config user.email "actions@github.com"
          git add models/field_classifier.pt models/validation_report.json
          git commit -m "chore(ai): publish validated continuous-learning model"
          git push
